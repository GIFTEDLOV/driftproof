name: GenLayer Four V4 - GenVM and Plain Address Gate
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['native/**/hardening_v4/**', 'native/test_v4_release.py', '.github/workflows/genlayer-native-v4-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install GenVM linter and tests
        run: python -m pip install --disable-pip-version-check genvm-linter pytest
      - name: Actual candidate tests, including GenVM plain string arguments
        run: python -m pytest -q --import-mode=importlib native/test_v4_release.py
      - name: GenVM lint / public ABI schema / source compile
        run: |
          set -euo pipefail
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            file="native/$app/hardening_v4/$app.py"
            python -m py_compile "$file"
            genvm-lint check "$file"
            genvm-lint schema "$file" --json > "/tmp/$app-v4-schema.json"
            test -s "/tmp/$app-v4-schema.json"
          done
