name: GenLayer Browser Production E2E
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths:
      - 'native/browser-smoke.spec.cjs'
      - '.github/workflows/genlayer-native-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Real production dashboard and chain-read smoke tests
        env:
          CI: 'true'
        run: |
          npx playwright test native/browser-smoke.spec.cjs --browser chromium --workers 1 --reporter line
      - name: Preserve diagnostic trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genlayer-browser-e2e-failure
          path: test-results/
          if-no-files-found: ignore
