name: NoticeClock V4 - Single Guarded Consensus Qualification
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/noticeclock-v4-single-qualify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noticeclock-v4-guarded-${{ github.sha }}
  cancel-in-progress: false
jobs:
  noticeclock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Confirm immutable deployed source, chain, and case absence before writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const address='0x99D41333f28913BA45Fc36C64eb0A88D1600F350';
          const expected='b968431218e2b8e1e24264a13a81c9cadde7a2d321e661df50e907dbed545e13';
          (async()=>{
            async function rpc(method,params){const r=await fetch('https://studio.genlayer.com/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const d=await r.json();if(!r.ok||d.error)throw Error(JSON.stringify(d.error||r.status));return d.result;}
            const chain=Number.parseInt(await rpc('eth_chainId',[]),16);if(chain!==61999)throw Error('WRONG_CHAIN:'+chain);
            const raw=await rpc('gen_getContractCode',[address]),actual=crypto.createHash('sha256').update(Buffer.from(raw,'base64')).digest('hex');
            if(actual!==expected)throw Error('IMMUTABLE_SOURCE_PARITY_FAIL');
            fs.writeFileSync('live-proof/noticeclock.json',JSON.stringify({name:'noticeclock',address,sourceSha256:expected,installedSha256:actual,chainId:61999,sourceParity:'PASS',originalDeployRun:39138161003,release:'v4'}));
            console.log('NOTICECLOCK_SOURCE_PARITY_PASS',actual);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Install pinned SDK and verify live harness
        run: |
          npm install --no-save --no-audit --no-fund genlayer-js@1.1.8
          node --check native/noticeclock_v4_live_qualify.mjs
      - name: Run exactly one fresh three-actor NoticeClock case; no blind retries
        run: node native/noticeclock_v4_live_qualify.mjs
      - name: Preserve all transaction hashes and state readbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticeclock-v4-guarded-consensus-evidence
          path: live-proof/*.json
          if-no-files-found: warn
          retention-days: 30
