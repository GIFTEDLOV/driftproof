name: GenLayer Four V4 - SDK Address Compatibility Deployment
on:
  push:
    branches:
      - workbench/genlayer-four-native-20261018
    paths:
      - '.github/workflows/genlayer-native-v4-studionet.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genlayer-four-v4-first-deploy-${{ github.sha }}
  cancel-in-progress: false
jobs:
  check-deploy-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test and lint exact candidate before deployment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest genvm-linter >/dev/null
          python -m pytest -q --import-mode=importlib native/test_v3_release.py
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            genvm-lint check "native/$app/hardening_v4/$app.py"
            genvm-lint schema "native/$app/hardening_v4/$app.py" --json > "/tmp/$app-v3-schema.json"
            test -s "/tmp/$app-v3-schema.json"
          done
      - name: Bind canonical Studionet chain and install GenLayer CLI
        run: |
          set -euo pipefail
          npm install --global genlayer
          genlayer network set studionet
          genlayer network info
          node <<'NODE'
          (async()=>{
            const r=await fetch('https://studio.genlayer.com/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_chainId',params:[],id:1})});
            const data=await r.json();
            if(!r.ok||parseInt(data.result,16)!==61999)throw Error('Studionet RPC or chain ID mismatch: '+JSON.stringify(data));
            console.log('STUDIONET_CHAIN_61999_CONFIRMED');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Create temporary gasless deployment signer (private password masked)
        run: |
          set -euo pipefail
          S="$(openssl rand -hex 32)"
          echo "::add-mask::$S"
          echo "DEPLOY_SIGNER_PASSWORD=$S" >> "$GITHUB_ENV"
          genlayer account create --name secure-four-v4 --password "$S" >/dev/null
          genlayer account use secure-four-v4 >/dev/null
      - name: Deploy each exactly once, preserve transaction before continuing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            contract="native/$app/hardening_v4/$app.py"
            echo "DEPLOYING_SECURE_V4 $app"
            if ! printf '%s\n' "$DEPLOY_SIGNER_PASSWORD" | genlayer deploy --contract "$contract" >"live-proof/$app.log" 2>&1;then
              echo "DEPLOY_COMMAND_FAILED $app (no automatic retry)"
              grep -Ei 'error|fail|invalid' "live-proof/$app.log" | cut -c 1-220 | tail -n 8 || true
              exit 1
            fi
            APP="$app" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),slug=process.env.APP;
          const log=fs.readFileSync(`live-proof/${slug}.log`,'utf8');
          const hash=[...log.matchAll(/'Transaction Hash':\s*'(0x[a-fA-F0-9]{64})'/g)].at(-1)?.[1];
          const address=[...log.matchAll(/'Contract Address':\s*'(0x[a-fA-F0-9]{40})'/g)].at(-1)?.[1];
          const executionSuccess=/execution_result:\s*'SUCCESS'/.test(log);
          const cliSuccess=/Contract deployed successfully/i.test(log);
          const source=fs.readFileSync(`native/${slug}/hardening_v4/${slug}.py`);
          const proof={name:slug,chainId:61999,transactionHash:hash||null,address:address||null,sourceSha256:crypto.createHash('sha256').update(source).digest('hex'),executionSuccess,cliSuccess,sourceCommit:process.env.GITHUB_SHA,release:'v4-sdk-address'};
          fs.writeFileSync(`live-proof/${slug}.json`,JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          if(!(hash&&address&&executionSuccess&&cliSuccess))process.exit(1);
          NODE
            sleep 3
          done
      - name: Verify actual installed GenVM bytes, not only CLI success
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
            for(const app of ['noticeclock','invoicebasis','parcelcourt','shiftfair']){
              const path=`live-proof/${app}.json`,proof=JSON.parse(fs.readFileSync(path,'utf8'));
              const response=await fetch('https://studio.genlayer.com/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'gen_getContractCode',params:[proof.address],id:1})});
              const data=await response.json();
              if(!response.ok||data.error)throw Error(`${app} source RPC failed: ${JSON.stringify(data.error||response.status)}`);
              const actual=crypto.createHash('sha256').update(Buffer.from(data.result,'base64')).digest('hex');
              proof.installedSourceSha256=actual;
              proof.sourceByteParity=actual===proof.sourceSha256?'PASS':'FAIL';
              fs.writeFileSync(path,JSON.stringify(proof,null,2)+'\n');
              console.log(app,'SOURCE_PARITY',proof.sourceByteParity,'ADDRESS',proof.address);
              if(proof.sourceByteParity!=='PASS')throw Error(app+' source mismatch');
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Preserve public proof without account material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genlayer-four-v4-studionet-public-evidence
          path: |
            live-proof/*.json
          if-no-files-found: warn
          retention-days: 30