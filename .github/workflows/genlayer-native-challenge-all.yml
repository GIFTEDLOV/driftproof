name: GenLayer Four Live Challenge and Hash-Chain Qualification
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/genlayer-native-challenge-all.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [noticeclock, invoicebasis, parcelcourt, shiftfair]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned Studionet CLI and SDK
        run: |
          npm i -g genlayer
          npm i --no-save --ignore-scripts genlayer-js@1.1.8
          genlayer network set studionet
      - name: Temporary signer pair with no published secrets
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "SECRET=$SECRET" >> "$GITHUB_ENV"
          genlayer account create --name challenge-creator --password "$SECRET" >/dev/null
          genlayer account create --name challenge-recipient --password "$SECRET" >/dev/null
          genlayer account use challenge-recipient >/dev/null
          OUT="$(genlayer account)"
          RECIPIENT="$(printf '%s' "$OUT" | sed -nE "s/.*address: '(0x[0-9a-fA-F]{40})'.*/\1/p" | head -n 1)"
          test -n "$RECIPIENT"
          echo "RECIPIENT=$RECIPIENT" >> "$GITHUB_ENV"
          genlayer account use challenge-creator >/dev/null
      - name: Challenge then independently re-adjudicate existing frozen evidence
        env:
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proofs
          case "$APP" in
            noticeclock) ADDRESS="0xDC02E6856e8DF12b0FaCB5e62a034Cb65a60eB1c"; EXTRA=(); RULE="Under Section 7 written notice must name a breach and a specific remedy with a 48-hour cure window."; EVIDENCE="Written notice: Section 7 credential access was breached and must be restored within 48 hours to cure the identified breach.";;
            invoicebasis) ADDRESS="0x0f0feAeE0AeAa4c98551622B074436565505A821"; EXTRA=(999 1 3); RULE="Software license invoice fees are eligible for a one-third revenue share; taxes and refunds are excluded."; EVIDENCE="Invoice for software license amount 999 minor units, category eligible software service, no taxes or refunds, backed by a receipt.";;
            parcelcourt) ADDRESS="0x14eBe8440453214CC5a923D5498402d5183A5Bcc"; EXTRA=(); RULE="Authorized signed handoff at reception desk is required, an arrival scan alone does not prove delivery."; EVIDENCE="Carrier record: reception agent signed parcel receipt at authorized desk, parcel ID included and delivery confirmed.";;
            shiftfair) ADDRESS="0xEEbed1EB184a4BE845286B5EF0003bCbFDB10C0C"; EXTRA=(120 90); RULE="Supervisor must authorize the additional shift, attendance must match and a hard cap of 90 minutes applies."; EVIDENCE="Written supervisor authorisation for worker B to complete 120 extra minutes, matching timestamped attendance shows work; pay cap 90 minutes.";;
            *) exit 2 ;;
          esac
          export ADDRESS CASE_ID="GCH-${APP}-${GITHUB_RUN_ID}"
          DEADLINE="$(($(date -u +%s) + 86400))"
          send() {
            local op="$1";shift
            printf '%s\n' "$SECRET" | genlayer write "$ADDRESS" "$op" --args "$@" >"proofs/$op.log" 2>&1 || { echo "CLI_FAILED $op"; exit 1; }
            OP="$op" node <<'NODE'
          import fs from 'node:fs';
          const op=process.env.OP,s=fs.readFileSync('proofs/'+op+'.log','utf8');
          const tx=s.match(/Write Transaction Hash:\s*\n?\s*(0x[0-9a-fA-F]{64})/)?.[1];
          if(!tx)throw new Error('Missing tx hash for '+op);
          fs.appendFileSync('proofs/transactions.jsonl',JSON.stringify({op,tx})+'\n');
          console.log('TX',JSON.stringify({op,tx}));
          NODE
          }
          check(){
            WANT="$1" node --input-type=module <<'NODE'
          import {createClient} from 'genlayer-js';
          import {studionet} from 'genlayer-js/chains';
          const c=createClient({chain:studionet});
          const state=JSON.parse(await c.readContract({address:process.env.ADDRESS,functionName:'get_case',args:[process.env.CASE_ID]}));
          const expected=process.env.WANT;
          const valid=expected==='CONSENTED'?state.consented===true : state.status===expected;
          if(!valid)throw new Error('Unexpected persisted state: '+JSON.stringify({expected,status:state.status,consented:state.consented}));
          console.log('READBACK',JSON.stringify({case:state.id,status:state.status,round:state.round,result:state.result}));
          NODE
          }
          send create_case "$CASE_ID" "$RECIPIENT" "$RULE" "$DEADLINE" "${EXTRA[@]}"
          check DRAFT
          genlayer account use challenge-recipient >/dev/null
          send consent "$CASE_ID"
          check CONSENTED
          genlayer account use challenge-creator >/dev/null
          send freeze "$CASE_ID"
          check FROZEN
          send submit_evidence "$CASE_ID" "$EVIDENCE"
          check EVIDENCE_LOCKED
          send adjudicate "$CASE_ID"
          check ASSESSED
          send challenge "$CASE_ID" "The original semantic assessment needs an independent reconsideration; evidence sufficiency is contested."
          check CHALLENGED
          sleep 12
          send adjudicate "$CASE_ID"
          check ASSESSED
          node --input-type=module <<'NODE'
          import {createClient} from 'genlayer-js';
          import {studionet} from 'genlayer-js/chains';
          const c=createClient({chain:studionet});
          const raw=await c.readContract({address:process.env.ADDRESS,functionName:'get_history',args:[process.env.CASE_ID]});
          const audit=JSON.parse(raw);
          const state=JSON.parse(await c.readContract({address:process.env.ADDRESS,functionName:'get_case',args:[process.env.CASE_ID]}));
          if(state.round!==2||audit.length!==2||audit[0].round!==1||audit[1].round!==2||!audit[0].entry_hash||audit[1].prev!==audit[0].entry_hash||audit[1].binding_sha256===audit[0].binding_sha256)throw new Error('Challenge provenance invariant failed');
          console.log('TWO_ROUND_LIVE_PROOF',JSON.stringify({contract:process.env.ADDRESS,caseId:process.env.CASE_ID,rounds:state.round,first: audit[0].verdict,second:audit[1].verdict,firstHash:audit[0].entry_hash,secondHash:audit[1].entry_hash,linked:audit[1].prev===audit[0].entry_hash}));
          NODE
      - name: Preserve hashes only, no keystores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genlayer-live-challenge-${{matrix.app}}
          path: proofs/transactions.jsonl
          retention-days: 30
          if-no-files-found: warn
