name: GenLayer V4 Canonical Live Dashboards
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['native/*/web/hardening_v4/app.js', '.github/workflows/genlayer-native-v4-live-ui.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      matrix: {app: [parcelcourt, shiftfair]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate live canonical registry and no synthetic fallback
        run: |
          set -euo pipefail
          file="native/${{ matrix.app }}/web/hardening_v4/app.js"
          node --check "$file"
          grep -q get_case_ids_page "$file"
          ! grep -q 'APP.items.map' "$file"
      - name: Bundle live dashboard with exact hardened adapter
        run: |
          set -euo pipefail
          cp "native/${{ matrix.app }}/web/hardening_v4/app.js" "native/${{ matrix.app }}/web/app.js"
          cp "native/${{ matrix.app }}/web/hardening_v4/onchain.js" "native/${{ matrix.app }}/web/onchain.js"
          cd "native/${{ matrix.app }}/web"
          npm install --no-audit --no-fund
          npm run build
