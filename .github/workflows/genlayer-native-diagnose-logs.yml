name: NoticeClock failed-execution evidence diagnostic
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/genlayer-native-diagnose-logs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing failure logs, without rebroadcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: GIFTEDLOV/driftproof
        run: |
          mkdir -p /tmp/proof
          gh run download 39109630294 -n noticeclock-live-qualification -D /tmp/proof
      - name: Summarize exact recorded error and receipts
        run: |
          python - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/proof')
          for f in sorted(p.glob('*')):
              if f.name.endswith('deployed-code.txt'): continue
              content=f.read_text(errors='replace')
              print('===',f.name,'lines',len(content.splitlines()),'===')
              for l in content.splitlines():
                  s=l.strip()
                  if len(s)>500:continue
                  if re.search(r'execution_result|execution_status|error_description|raw_error|error_code|Transaction Hash|Contract Address|status:|result:|reason:|Error:|ValueError|UserError|TypeError|AttributeError|wasm|traceback|returned',s,re.I):
                    print(s[:400])
          PY
