name: GenLayer Four V4 - Independent Release Archives
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/genlayer-native-v4-packages.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build separated V4 repositories with source hashes
        run: |
          python <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import shutil,json,zipfile,os
          apps=['noticeclock','invoicebasis','parcelcourt','shiftfair']
          out=Path('release-package');out.mkdir(exist_ok=True)
          for app in apps:
              target=out/app
              target.mkdir(exist_ok=True)
              (target/'contracts').mkdir(exist_ok=True)
              src=Path(f'native/{app}/hardening_v4/{app}.py')
              dst=target/'contracts'/f'{app}.py'
              shutil.copy2(src,dst)
              if Path(f'native/{app}/tests').exists():shutil.copytree(f'native/{app}/tests',target/'tests',dirs_exist_ok=True)
              if Path(f'native/{app}/docs').exists():shutil.copytree(f'native/{app}/docs',target/'docs',dirs_exist_ok=True)
              if app in ('parcelcourt','shiftfair'):
                  (target/'web').mkdir(exist_ok=True)
                  for f in ['index.html','app.js','styles.css','vercel.json','package.json']:
                      shutil.copy2(f'native/{app}/web/{f}',target/'web'/f)
                  shutil.copy2(f'native/{app}/web/hardening_v4/onchain.js',target/'web/onchain.js')
              h=sha256(dst.read_bytes()).hexdigest()
              manifest={'project':app,'chainId':61999,'contractSourceSha256':h,'generation':'v4','deployedProofStatus':'MUST_VERIFY_SEPARATELY','repositoryReleaseState':'CANDIDATE_ONLY','sourceCommit':os.getenv('GITHUB_SHA')}
              (target/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
              (target/'README.md').write_text('# '+app.upper()+' – GenLayer V4 security candidate\n\nThis archive contains the latest source and tests. Do not submit until all live consensus and wallet gates pass.\n\nDeployment evidence and issuer authenticity require independent review.\n')
              zpath=out/f'GenLayer_{app}_V4_Repository_Candidate.zip'
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
                  for f in sorted(target.rglob('*')):
                      if f.is_file():z.write(f,f.relative_to(target))
              print(app,h,zpath)
          with zipfile.ZipFile(out/'GenLayer_Four_V4_Release_Candidates.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(out.glob('GenLayer_*_V4_Repository_Candidate.zip')):z.write(f,f.name)
          PY
      - name: Preserve four independent repo archives and combined package
        uses: actions/upload-artifact@v4
        with:
          name: genlayer-four-v4-repository-packages
          path: release-package/*.zip
          retention-days: 30
