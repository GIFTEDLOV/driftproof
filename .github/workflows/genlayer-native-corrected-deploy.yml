name: GenLayer Native Typed-Address Corrected Deploy
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/genlayer-native-corrected-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-then-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Lint and security gates before any deployment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check genvm-linter >/dev/null
          python native/test_native.py -q
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            genvm-lint check "native/$app/contracts/$app.py"
          done
      - name: Install GenLayer CLI and target built-in Studionet
        run: |
          npm i -g genlayer
          genlayer network set studionet
          genlayer network info
      - name: Ephemeral gasless signer with masked password
        run: |
          set -euo pipefail
          S="$(openssl rand -hex 32)"
          echo "::add-mask::$S"
          echo "SECRET=$S" >> "$GITHUB_ENV"
          genlayer account create --name native-address-fix --password "$S" >/dev/null
          genlayer account use native-address-fix >/dev/null
      - name: Exactly one corrected deployment per contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            echo "DEPLOYING $app"
            if ! printf '%s\n' "$SECRET" | genlayer deploy --contract "native/$app/contracts/$app.py" >"live-proof/$app.log" 2>&1;then
              echo "DEPLOY_COMMAND_FAILED $app (no retry)"
              grep -Ei 'error|fail|invalid' "live-proof/$app.log" | cut -c 1-220 | tail -n 8 || true
              exit 1
            fi
            APP="$app" node <<'NODE'
          const fs=require('fs'),name=process.env.APP,s=fs.readFileSync('live-proof/'+name+'.log','utf8');
          const transactionHash=[...s.matchAll(/'Transaction Hash':\s*'(0x[a-fA-F0-9]{64})'/g)].at(-1)?.[1];
          const address=[...s.matchAll(/'Contract Address':\s*'(0x[a-fA-F0-9]{40})'/g)].at(-1)?.[1];
          const executionSuccess=/execution_result:\s*'SUCCESS'/.test(s),cliSuccess=/Contract deployed successfully/i.test(s);
          const out={name,chainId:61999,transactionHash:transactionHash||null,address:address||null,executionSuccess,cliSuccess,release:'typed-recipient',sourceCommit:process.env.GITHUB_SHA};
          fs.writeFileSync('live-proof/'+name+'.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          if(!(transactionHash&&address&&executionSuccess&&cliSuccess))process.exit(1);
          NODE
            sleep 5
          done
      - name: Keep verified transaction evidence without key material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genlayer-four-address-corrected-proofs
          path: live-proof/*.json
          if-no-files-found: warn
          retention-days: 30
