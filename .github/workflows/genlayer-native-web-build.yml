name: GenLayer Native Web SDK Build
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths:
      - 'native/*/web/**'
      - '.github/workflows/genlayer-native-web-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vite-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {app: [parcelcourt, shiftfair]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned SDK and build production assets
        working-directory: native/${{ matrix.app }}/web
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
