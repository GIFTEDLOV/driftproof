name: GenLayer Native Four - Source Quality
on:
  push:
    branches:
      - workbench/genlayer-four-native-20261018
    paths:
      - 'native/**'
      - '.github/workflows/genlayer-native-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-tests-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and modeled contract behavior
        run: |
          python -m compileall -q native
          python native/test_native.py -v
      - name: Static interface syntax and HTML presence
        run: |
          node --check native/parcelcourt/web/app.js
          node --check native/shiftfair/web/app.js
          test -s native/parcelcourt/web/index.html
          test -s native/shiftfair/web/index.html
      - name: Install official GenVM linter
        run: python -m pip install --disable-pip-version-check genvm-linter
      - name: Lint and validate all four candidate contracts
        run: |
          set -euo pipefail
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            echo "Contract $app"
            genvm-lint check "native/$app/contracts/$app.py"
            genvm-lint schema "native/$app/contracts/$app.py" --json >/tmp/"$app".abi.json
            test -s /tmp/"$app".abi.json
          done
