name: GenLayer Native Studionet Smoke Deploy - NoticeClock
on:
  push:
    branches:
      - workbench/genlayer-four-native-20261018
    paths:
      - '.github/workflows/genlayer-native-smoke-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official GenLayer CLI
        run: npm install --global genlayer
      - name: Select verified built-in Studionet chain
        run: |
          genlayer network set studionet
          genlayer network info
      - name: Generate throwaway gasless test signer in CI (never expose keys)
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          echo "GENLAYER_CI_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          genlayer account create --name native-smoke-ci --password "$PASSWORD" >/dev/null 2>/tmp/account-create.err
          genlayer account use native-smoke-ci >/dev/null
          genlayer account | grep -Ei 'address|network|balance' || true
      - name: Single controlled deploy attempt
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          printf '%s\n' "$GENLAYER_CI_PASSWORD" | genlayer deploy --contract native/noticeclock/contracts/noticeclock.py >live-proof/noticeclock_deploy.log 2>&1 || {
            echo "Deployment command failed. Not broadcasting again automatically."
            grep -Ei 'error|failed|runner|execution|transaction|network|timeout|invalid' live-proof/noticeclock_deploy.log | tail -n 24 || true
            exit 1
          }
          echo "Deploy command completed. Inspecting receipt and canonical execution status:"
          grep -Ei 'transaction|contract|finalized|execution|deployed|receipt|success|error|address' live-proof/noticeclock_deploy.log | tail -n 32 || true
      - name: Preserve nonsecret transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticeclock-studionet-attempt
          path: live-proof/*.log
          if-no-files-found: warn
          retention-days: 30
