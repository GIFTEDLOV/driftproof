name: GenLayer Four V3 - Diagnose Finalized Write Errors
on:
  push:
    branches: [workbench/genlayer-four-native-20261018]
    paths: ['.github/workflows/genlayer-native-v3-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-receipt-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install CLI and configure Studionet; no signing or broadcasts
        run: |
          npm install -g genlayer
          genlayer network set studionet
          genlayer receipt --help | head -80 || true
      - name: Retrieve finalized execution result for four precise tx hashes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          declare -A HASHES
          HASHES[noticeclock]='0x52b61e5b90f39576259e3d6bc80d423d58f96c25d2b2a8b4a7c00c83df768d31'
          HASHES[invoicebasis]='0xb897a2927f64e5d4affbd8bf3e5089024823ed28b0f8dcc48a6975f1185d81ce'
          HASHES[parcelcourt]='0x898505caf00ebd13e47381f5dbe65ea8e88983c6d2ab9d77a381c432cc885a7b'
          HASHES[shiftfair]='0xefd6900650d0971bdcdd2239920ec66dabd6cf9a76bdfb66c7b8a3ba50cd6caf'
          for app in noticeclock invoicebasis parcelcourt shiftfair; do
            echo "===== ${app} READONLY RECEIPT ====="
            genlayer receipt "${HASHES[$app]}" >"diagnostics/$app.log" 2>&1 || true
            sed -n '1,130p' "diagnostics/$app.log" | cut -c 1-350
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-v3-create-case-receipt-diagnosis
          path: diagnostics/*.log